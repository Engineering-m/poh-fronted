<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENGINEERING SYSTEM</title>

  <!-- Theme init — harus di atas CSS untuk hindari flash -->
  <script>
    (function() {
      var t = localStorage.getItem('poh_theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-root">
  <div id="main-container" style="display:none">

    <header class="top-bar">
      <div class="top-bar-left">
        <button class="sidebar-toggle" id="btn-sidebar-toggle" aria-label="Toggle sidebar">
          <span></span><span></span><span></span>
        </button>
        <div class="brand">
          <span class="brand-mark">◼</span>
          <span class="brand-text">ENGINEERING<br>SYSTEM</span>
        </div>
      </div>
      <nav class="breadcrumb mono" id="breadcrumb">DASHBOARD</nav>
      <div class="top-bar-right">
        <span class="user-name mono" id="user-display">…</span>
        <button class="btn-icon" id="btn-theme" title="Toggle theme">◐</button>
        <button class="btn-icon" id="btn-logout" title="Logout">⏻</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <nav class="nav-list">
          <a class="nav-item" data-route="dashboard"><span class="nav-label">HOME</span><span class="nav-arrow">→</span></a>
          <a class="nav-item" data-route="projects"><span class="nav-label">PROJECTS</span><span class="nav-arrow">→</span></a>
          <a class="nav-item" data-route="manpower"><span class="nav-label">MANPOWER</span><span class="nav-arrow">→</span></a>
          <a class="nav-item" data-route="tasks"><span class="nav-label">TASKS</span><span class="nav-arrow">→</span></a>
          <a class="nav-item" data-route="requests"><span class="nav-label">REQUESTS</span><span class="nav-arrow">→</span></a>
          <a class="nav-item" data-route="compose"><span class="nav-label">COMPOSE</span><span class="nav-arrow">→</span></a>
          <div class="nav-divider"></div>
          <a class="nav-item" data-route="settings"><span class="nav-label">SETTINGS</span><span class="nav-arrow">→</span></a>
        </nav>
        <div class="sidebar-footer mono">
          <div>V1.0.0</div>
          <div class="sidebar-footer-sub">PROJECT OPERATIONS HUB</div>
        </div>
      </aside>

      <main class="main-content" id="main-content">
        <div class="loading-state">LOADING…</div>
      </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav" id="bottom-nav">
      <a class="bottom-nav-item" data-route="dashboard">
        <span class="bn-icon">◈</span>
        <span class="bn-label">HOME</span>
      </a>
      <a class="bottom-nav-item" data-route="projects">
        <span class="bn-icon">▤</span>
        <span class="bn-label">PROJECTS</span>
      </a>
      <a class="bottom-nav-item" data-route="tasks">
        <span class="bn-icon">✓</span>
        <span class="bn-label">TASKS</span>
      </a>
      <a class="bottom-nav-item" data-route="manpower">
        <span class="bn-icon">⚇</span>
        <span class="bn-label">CREW</span>
      </a>
      <a class="bottom-nav-item" data-route="settings">
        <span class="bn-icon">⚙</span>
        <span class="bn-label">MORE</span>
      </a>
    </nav>

    <div class="toast-container" id="toast-container"></div>

    <div class="modal-backdrop" id="modal-backdrop" style="display:none">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h3 id="modal-title">MODAL</h3>
          <button class="btn-icon" id="modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app-init.js"></script>
<script src="js/api.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/projects.js"></script>
<script src="js/views/manpower.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/compose.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>

</body>
</html>
