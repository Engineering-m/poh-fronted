<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN — ENGINEERING SYSTEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-bg" id="login-bg"></div>
    <div class="login-overlay"></div>
    <div class="login-content">
      <div class="login-card">
        <div class="login-brand">
          <span class="login-mark">◼</span>
          <h1>ENGINEERING<br>SYSTEM</h1>
        </div>
        <div class="login-sub mono">PROJECT OPERATIONS HUB</div>

        <div class="login-form">
          <div class="form-row">
            <label class="mono">USERNAME</label>
            <input class="input" type="text" id="login-username" required autofocus autocomplete="off" />
          </div>
          <div class="form-row">
            <label class="mono">PASSWORD</label>
            <input class="input" type="password" id="login-password" required autocomplete="off" />
          </div>
          <div id="login-error" class="banner critical" style="display:none"></div>
          <button class="btn" id="btn-login">MASUK →</button>
        </div>

        <div class="login-footer mono">
          <span>V1.0.0</span>
          <span>INTERNAL USE ONLY</span>
        </div>
      </div>

      <div class="login-hero">
        <div class="login-hero-text">
          <span class="hero-label mono">INDUSTRIAL</span>
          <h2>OPERATIONS<br>&amp; PROJECT<br>MANAGEMENT</h2>
          <p class="mono">Track. Execute. Deliver.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Background image settings -->
  <script>
    // Ganti URL ini untuk ubah foto latar belakang login
    const LOGIN_BG_URL = 'https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?w=1920&q=80';
    document.getElementById('login-bg').style.backgroundImage = 'url(' + LOGIN_BG_URL + ')';
  </script>

  <script src="js/config.js"></script>
  <script src="js/app-init.js"></script>
  <script src="js/api.js"></script>
  <script>
    const saved = localStorage.getItem('poh_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);

    const token = sessionStorage.getItem(CONFIG.SESSION_KEY);
    if (token) window.location.href = 'index.html';

    document.getElementById('btn-login').addEventListener('click', handleLogin);
    document.getElementById('login-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl    = document.getElementById('login-error');
      const btnEl    = document.getElementById('btn-login');

      if (!username || !password) { showError('Username dan password wajib diisi.'); return; }

      btnEl.disabled = true;
      btnEl.textContent = 'MEMPROSES…';
      errEl.style.display = 'none';

      try {
        const res = await API.login(username, password);
        sessionStorage.setItem(CONFIG.SESSION_KEY, res.token);
        sessionStorage.setItem('poh_user', JSON.stringify({
          username: res.username, display_name: res.display_name, role: res.role
        }));
        window.location.href = 'index.html';
      } catch (err) {
        showError(err.message || 'Login gagal.');
        btnEl.disabled = false;
        btnEl.textContent = 'MASUK →';
      }
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
